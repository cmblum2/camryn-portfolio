name: status
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping deployments and write status.json
        run: |
          # classify <url> <kind>  ->  up | idle | down
          #   kind=core    : should always be up; a redirect still counts as up, anything else is down
          #   kind=sleeper : free-tier app that naps; 2xx = up, otherwise (3xx redirect / timeout / 5xx) = idle
          classify() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$1" || echo 000)
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then echo up
            elif [ "$2" = "core" ] && [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then echo up
            elif [ "$2" = "sleeper" ]; then echo idle
            else echo down; fi
          }
          SITE=$(classify "https://cmblum2.github.io/camryn-portfolio/" core)
          NL2SQL=$(classify "https://ask-your-warehouse.streamlit.app" sleeper)
          RAG=$(classify "https://creator-insight-assistant.onrender.com" sleeper)
          DBT=$(classify "https://github.com/cmblum2/retail-analytics-dbt/actions/workflows/ci.yml/badge.svg" core)
          cat > status.json <<EOF
          { "systems": [
            { "name": "site", "state": "$SITE" },
            { "name": "nl2sql", "state": "$NL2SQL" },
            { "name": "rag", "state": "$RAG" },
            { "name": "dbt-ci", "state": "$DBT" }
          ], "checkedAt": "$(date -u +%FT%TZ)" }
          EOF
      - name: Commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "chore: update live status [skip ci]"
          git push
