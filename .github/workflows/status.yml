name: status
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping deployments and write status.json
        run: |
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -L "$1" || echo 000); if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then echo true; else echo false; fi; }
          SITE=$(check "https://cmblum2.github.io/camryn-portfolio/")
          NL2SQL=$(check "https://ask-your-warehouse.streamlit.app")
          RAG=$(check "https://creator-insight-assistant.onrender.com")
          DBT=$(check "https://github.com/cmblum2/retail-analytics-dbt/actions/workflows/ci.yml/badge.svg")
          cat > status.json <<EOF
          { "systems": [
            { "name": "site", "up": $SITE },
            { "name": "nl2sql", "up": $NL2SQL },
            { "name": "rag", "up": $RAG },
            { "name": "dbt-ci", "up": $DBT }
          ], "checkedAt": "$(date -u +%FT%TZ)" }
          EOF
      - name: Commit if changed
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "chore: update live status [skip ci]"
          git push
